name: One-shot Z Studio P2 harness reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/maintenance-zstudio-p2-harness-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'chore/zos-five-app-convergence-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/zos-five-app-convergence-v1
          fetch-depth: 0

      - name: Reconcile P2 harness with current preview and mobile authorities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/studio/tests/run-p2-hierarchy-regression.js')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              print(f'{label}_MATCHES={count}')
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              s = s.replace(old, new, 1)

          replace_once(
          """  async function renderCase(\n    format,\n    template,\n    setup\n  ) {""",
          """  async function renderCase(\n    format,\n    template,\n    setup,\n    options = {}\n  ) {""",
          'RENDER_CASE_SIGNATURE')

          replace_once(
          """    state.img = null;\n    state.photo = null;\n    state.photos = [];\n    state.carPhotos = [];\n\n    state.title =""",
          """    state.img = null;\n    state.photo = null;\n    state.photos = [];\n    state.carPhotos = [];\n\n    if (options.media !== false) {\n      const source = document.createElement('canvas');\n      source.width = 1600;\n      source.height = 1000;\n      const sourceCtx = source.getContext('2d');\n      sourceCtx.fillStyle = '#6b655c';\n      sourceCtx.fillRect(0, 0, source.width, source.height);\n      sourceCtx.fillStyle = '#b8935a';\n      sourceCtx.fillRect(0, 0, 480, source.height);\n      state.img = source;\n      state.photo = 'p2-contract-media';\n      state.photos = ['p2-contract-media'];\n      state.carPhotos = ['p2-contract-media'];\n    }\n\n    state.title =""",
          'READY_MEDIA_FIXTURE')

          replace_once(
          """          state.showSpecs =\n            false;\n        }\n      );""",
          """          state.showSpecs =\n            false;\n        },\n        { media:false }\n      );""",
          'EMPTY_MEDIA_OVERRIDE')

          replace_once("primary alpha 0.82", "primary alpha 0.78", 'PRIMARY_ALPHA_LABEL')
          replace_once("primary.alpha -\n        0.82", "primary.alpha -\n        0.78", 'PRIMARY_ALPHA_VALUE')
          replace_once("secondary alpha 0.60", "secondary alpha 0.52", 'SECONDARY_ALPHA_LABEL')
          replace_once("secondary.alpha -\n        0.60", "secondary.alpha -\n        0.52", 'SECONDARY_ALPHA_VALUE')

          anchor = """  // ========================================================\n  // P2.4 NON-FINANCE CATEGORY EXTRAS — MOBILE\n  // ========================================================\n\n"""
          helper = """  // ========================================================\n  // P2.4 NON-FINANCE CATEGORY EXTRAS — MOBILE\n  // ========================================================\n\n  function openMobileDetailsForContract() {\n    const wrapper = document.getElementById('zsMobileTextDetails');\n    const toggle = document.getElementById('zsMobileTextDetailsToggle');\n    if (wrapper) wrapper.classList.add('open');\n    if (toggle) toggle.setAttribute('aria-expanded', 'true');\n  }\n\n"""
          replace_once(anchor, helper, 'MOBILE_DETAILS_HELPER')

          replace_once(
          """    renderCategoryExtras();\n\n    return document.getElementById(""",
          """    renderCategoryExtras();\n    openMobileDetailsForContract();\n\n    return document.getElementById(""",
          'CATEGORY_DETAILS_OPEN')

          replace_once(
          """    renderCategoryExtras();\n\n    const root =\n      document.getElementById(""",
          """    renderCategoryExtras();\n    openMobileDetailsForContract();\n\n    const root =\n      document.getElementById(""",
          'FINANCE_LOOP_DETAILS_OPEN')

          replace_once(
          """  renderCategoryExtras();\n\n  {\n    const root =""",
          """  renderCategoryExtras();\n  openMobileDetailsForContract();\n\n  {\n    const root =""",
          'FINANCE_FALLBACK_DETAILS_OPEN')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          actual="$(git diff --name-only | sort)"
          expected='apps/studio/tests/run-p2-hierarchy-regression.js'
          printf 'ACTUAL=%s\nEXPECTED=%s\n' "$actual" "$expected"
          test "$actual" = "$expected"

      - name: Commit exact harness reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/tests/run-p2-hierarchy-regression.js
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = 'apps/studio/tests/run-p2-hierarchy-regression.js'
          git commit -m 'test(studio): reconcile P2 hierarchy harness with approved UX'
          git push origin HEAD:chore/zos-five-app-convergence-v1

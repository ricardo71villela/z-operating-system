name: Z Studio Light Polish Build Helper

on:
  push:
    branches:
      - fix/zstudio-light-contrast-v1

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/zstudio-light-contrast-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Z Studio artifacts
        run: node apps/studio/scripts/build.js

      - name: Verify light polish static contract
        run: node apps/studio/tests/run-app-theme-light-polish-regression.js

      - name: Install Electron test harness
        run: npm ci --prefix apps/studio/tests

      - name: Verify dual app theme runtime
        run: npm run test:app-theme --prefix apps/studio/tests -- ../app/my-studio.html

      - name: Verify generated authority
        shell: bash
        run: |
          set -euo pipefail
          cmp apps/studio/app/index.html apps/studio/app/my-studio.html
          cmp apps/studio/app/index.html apps/studio/native/www/index.html
          grep -Fq 'ZSTUDIO_APP_THEME_LIGHT_POLISH_V1' apps/studio/app/index.html
          grep -Fq 'html[data-zstudio-app-theme="light"] .zs-assistant-empty-title' apps/studio/app/index.html
          grep -Fq 'html[data-zstudio-app-theme="light"] .site-footer' apps/studio/app/index.html
          python3 - <<'PY'
          import subprocess
          allowed = {
              'apps/studio/app/index.html',
              'apps/studio/app/my-studio.html',
              'apps/studio/native/www/index.html',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('Unexpected build mutations: ' + ', '.join(sorted(unexpected)))
          if changed != allowed:
              raise SystemExit('Expected exactly the three generated HTML artifacts; got: ' + ', '.join(sorted(changed)))
          print('GENERATED_CHANGE_BOUNDARY=PASS')
          PY

      - name: Commit generated artifacts and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zstudio-light-polish-build-helper.yml
          git add apps/studio/app/index.html apps/studio/app/my-studio.html apps/studio/native/www/index.html
          git commit -m 'build(zstudio): refresh light theme polish artifacts'
          git push origin HEAD:fix/zstudio-light-contrast-v1

name: Z Studio Server-Only Commercial Writer Client Authority

on:
  push:
    branches:
      - feature/zstudio-apple-server-verification-v1
    paths:
      - 'apps/studio/commercial/lib/commercial-writer-client.js'
      - 'apps/studio/commercial/tests/commercial-writer-client.test.js'
      - 'apps/studio/commercial/package.json'
      - '.github/workflows/zstudio-commercial-writer-client-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commercial-writer-client-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact triggering authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install exact commercial dependencies
        working-directory: apps/studio/commercial
        run: npm ci --ignore-scripts

      - name: Check commercial runtime source
        working-directory: apps/studio/commercial
        run: npm run check

      - name: Test server-only commercial writer client
        working-directory: apps/studio/commercial
        run: npm test

      - name: Verify frozen commercial authorities remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${GITHUB_SHA}^" "${GITHUB_SHA}" -- \
            infrastructure/supabase/migrations/20260819130000_zstudio_commercial_activation_authority_v1.sql \
            apps/studio/commercial/package-lock.json \
            apps/studio/commercial/store-products.v1.json \
            apps/studio/commercial/certs/AppleIncRootCertificate.cer \
            apps/studio/commercial/certs/AppleRootCA-G2.cer \
            apps/studio/commercial/certs/AppleRootCA-G3.cer \
            apps/studio/commercial/certs/root-authority.v1.json \
            apps/studio/commercial/lib/apple-signed-data.js \
            apps/studio/commercial/lib/apple-server-api.js \
            apps/studio/commercial/lib/commercial-event-adapter.js

      - name: Verify no live Supabase target or credential is embedded
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E \
            'dcdggqyazdddrfuzwavw|sb_secret_[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{20,}' \
            apps/studio/commercial/lib/commercial-writer-client.js \
            apps/studio/commercial/tests/commercial-writer-client.test.js; then
            echo 'Unexpected live Supabase authority or credential material.'
            exit 1
          fi

      - name: Verify modern secret-key RPC contract and no automatic retry
        shell: bash
        run: |
          set -euo pipefail
          grep -q "zstudio_apply_verified_commercial_event" \
            apps/studio/commercial/lib/commercial-writer-client.js
          grep -q "rest/v1/rpc" \
            apps/studio/commercial/lib/commercial-writer-client.js
          grep -q "supabaseSecretKey" \
            apps/studio/commercial/lib/commercial-writer-client.js
          grep -q "apikey: secretKey" \
            apps/studio/commercial/lib/commercial-writer-client.js
          if grep -E -i 'authorization[^\n]*secretKey|Bearer[^\n]*secretKey' \
            apps/studio/commercial/lib/commercial-writer-client.js; then
            echo 'Supabase secret key must never be sent as Authorization Bearer.'
            exit 1
          fi
          if grep -q "supabaseServiceRole" \
            apps/studio/commercial/lib/commercial-writer-client.js; then
            echo 'Legacy service-role config remains in writer client.'
            exit 1
          fi
          if grep -E 'for \(.*attempt|while \(|setInterval\(' \
            apps/studio/commercial/lib/commercial-writer-client.js; then
            echo 'Unexpected automatic retry loop in writer client.'
            exit 1
          fi

      - name: Record server-only writer client authority
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="${GITHUB_SHA}"
          branch='feature/zstudio-apple-server-verification-v1'
          marker='apps/studio/commercial/verification/commercial-writer-client.v1.json'

          rm -rf apps/studio/commercial/node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          mkdir -p "$(dirname "$marker")"

          cat > "$marker" <<EOF
          {
            "authority": "ZSTUDIO_SERVER_ONLY_COMMERCIAL_WRITER_CLIENT_V1",
            "result": "PASS",
            "testedCommit": "$tested_sha",
            "rpc": "public.zstudio_apply_verified_commercial_event",
            "writerArgumentCount": 15,
            "transport": "supabase_rest_rpc",
            "serverCredential": "SUPABASE_SECRET_KEY",
            "secretKeyHeader": "apikey",
            "secretKeyAuthorizationBearer": false,
            "automaticRetry": false,
            "databaseWriteExecuted": false,
            "liveDatabaseMutation": false
          }
          EOF

          unexpected="$({ git status --porcelain --untracked-files=all; } \
            | awk '$2 != "apps/studio/commercial/verification/commercial-writer-client.v1.json" { print }')"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected mutation(s):'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git add "$marker"
          git commit -m 'test(studio): record server-only writer client pass'

          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" \
              && git push origin "HEAD:$branch"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to serialize writer-client authority marker.'
              exit 1
            fi
            sleep 2
          done

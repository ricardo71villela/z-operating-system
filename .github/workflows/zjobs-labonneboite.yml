name: Z Jobs — La Bonne Boîte (empresas que vão contratar)

# Estabelecimentos com forte potencial de contratação segundo a France
# Travail (API La Bonne Boîte v2), para escolher primeiro as empresas que
# vão recrutar (tabela zjobs_recrutamento no Supabase ZOS).
# Todos os meses, no dia 2 às 04:00 UTC, ou à mão no separador Actions.
# Num pull request que mexa no pipeline, só corre os testes.

on:
  schedule:
    - cron: "0 4 2 * *"
  workflow_dispatch:
    inputs:
      dept:
        description: "Só este departamento (ex. 74) — vazio = todos"
        required: false
        default: ""
      domain:
        description: "Só este grande domínio ROME (A–N, ex. F = construção) — vazio = todos"
        required: false
        default: ""
  pull_request:
    paths:
      - "apps/jobs/ingest/labonneboite/**"
      - "infrastructure/supabase/migrations/*z_jobs_recrutamento*"
      - ".github/workflows/zjobs-labonneboite.yml"

permissions:
  contents: read

concurrency:
  group: zjobs-labonneboite
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: apps/jobs/ingest/labonneboite
    env:
      FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
      ZJOBS_SUPABASE_SERVICE_KEY: ${{ secrets.ZFIND_SUPABASE_SERVICE_KEY }}
      DEPT: ${{ github.event.inputs.dept || '' }}
      DOMAIN: ${{ github.event.inputs.domain || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        id: tests
        run: python tests/test_lbb.py

      - name: La Bonne Boîte
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && github.event_name != 'pull_request' }}
        run: |
          args=""
          if [ -n "$DEPT" ]; then args="$args --dept $DEPT"; fi
          if [ -n "$DOMAIN" ]; then args="$args --domain $DOMAIN"; fi
          python src/fetch_lbb.py $args

name: Z Studio Apple Device Reconciliation HTTP Authority

on:
  push:
    branches:
      - feature/zstudio-apple-server-verification-v1
    paths:
      - 'apps/studio/commercial/api/apple/reconcile.js'
      - 'apps/studio/commercial/lib/apple-device-reconcile-http.js'
      - 'apps/studio/commercial/tests/apple-device-reconcile-http.test.js'
      - 'apps/studio/commercial/package.json'
      - '.github/workflows/zstudio-apple-device-reconcile-http-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apple-device-reconcile-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact triggering authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install exact commercial dependencies
        working-directory: apps/studio/commercial
        run: npm ci --ignore-scripts

      - name: Check commercial runtime syntax
        working-directory: apps/studio/commercial
        run: npm run check

      - name: Test full commercial runtime
        working-directory: apps/studio/commercial
        run: npm test

      - name: Verify frozen commercial authorities remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${GITHUB_SHA}^" "${GITHUB_SHA}" -- \
            infrastructure/supabase/migrations/20260819130000_zstudio_commercial_activation_authority_v1.sql \
            apps/studio/commercial/package-lock.json \
            apps/studio/commercial/store-products.v1.json \
            apps/studio/commercial/certs/AppleIncRootCertificate.cer \
            apps/studio/commercial/certs/AppleRootCA-G2.cer \
            apps/studio/commercial/certs/AppleRootCA-G3.cer \
            apps/studio/commercial/certs/root-authority.v1.json \
            apps/studio/commercial/lib/apple-signed-data.js \
            apps/studio/commercial/lib/apple-server-api.js \
            apps/studio/commercial/lib/commercial-event-adapter.js \
            apps/studio/commercial/lib/commercial-writer-client.js

      - name: Verify endpoint boundary is secret-safe and live-neutral
        shell: bash
        run: |
          set -euo pipefail
          files='apps/studio/commercial/api/apple/reconcile.js apps/studio/commercial/lib/apple-device-reconcile-http.js'
          if grep -E 'dcdggqyazdddrfuzwavw|sb_secret_[A-Za-z0-9_-]+|eyJ[a-zA-Z0-9_-]{20,}' $files; then
            echo 'Live authority or credential literal entered endpoint boundary.'
            exit 1
          fi
          if grep -E 'setInterval\(|for[[:space:]]*\([^;]*;[^;]*;[^)]*\)[[:space:]]*\{[^}]*applyCommercialEvent' \
            apps/studio/commercial/lib/apple-device-reconcile-http.js; then
            echo 'Automatic commercial write retry entered endpoint gate.'
            exit 1
          fi

      - name: Record Apple device reconcile HTTP authority
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="${GITHUB_SHA}"
          branch='feature/zstudio-apple-server-verification-v1'
          marker='apps/studio/commercial/verification/apple-device-reconcile-http.v1.json'

          rm -rf apps/studio/commercial/node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          mkdir -p "$(dirname "$marker")"

          cat > "$marker" <<EOF
          {
            "authority": "ZSTUDIO_APPLE_DEVICE_RECONCILE_HTTP_V1",
            "result": "PASS",
            "testedCommit": "$tested_sha",
            "route": "/api/apple/reconcile",
            "bearerAuth": true,
            "canonicalPersonRequired": true,
            "appAccountTokenEqualityRequired": true,
            "clientCommercialAuthorityAccepted": false,
            "writerRequiredBeforeSuccess": true,
            "finishTransactionExecuted": false,
            "liveDatabaseMutation": false
          }
          EOF

          unexpected="$({ git status --porcelain --untracked-files=all; } \
            | awk '$2 != "apps/studio/commercial/verification/apple-device-reconcile-http.v1.json" { print }')"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected mutation(s):'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git add "$marker"
          git commit -m 'test(studio): record Apple device reconcile HTTP pass'

          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" \
              && git push origin "HEAD:$branch"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to serialize Apple device reconcile marker.'
              exit 1
            fi
            sleep 2
          done

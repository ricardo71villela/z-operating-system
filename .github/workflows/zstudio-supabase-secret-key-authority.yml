name: Z Studio Supabase Secret-Key Commercial Runtime Authority

on:
  push:
    branches:
      - feature/zstudio-apple-server-verification-v1
    paths:
      - 'apps/studio/commercial/lib/config.js'
      - 'apps/studio/commercial/lib/commercial-writer-client.js'
      - 'apps/studio/commercial/tests/foundation.test.js'
      - 'apps/studio/commercial/tests/commercial-writer-client.test.js'
      - '.github/workflows/zstudio-commercial-writer-client-authority.yml'
      - '.github/workflows/zstudio-supabase-secret-key-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supabase-secret-key-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact triggering authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install exact commercial dependencies
        working-directory: apps/studio/commercial
        run: npm ci --ignore-scripts

      - name: Check commercial runtime source
        working-directory: apps/studio/commercial
        run: npm run check

      - name: Test complete commercial runtime
        working-directory: apps/studio/commercial
        run: npm test

      - name: Verify commercial migration and frozen authorities untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${GITHUB_SHA}^" "${GITHUB_SHA}" -- \
            infrastructure/supabase/migrations/20260819130000_zstudio_commercial_activation_authority_v1.sql \
            apps/studio/commercial/package-lock.json \
            apps/studio/commercial/store-products.v1.json \
            apps/studio/commercial/certs/AppleIncRootCertificate.cer \
            apps/studio/commercial/certs/AppleRootCA-G2.cer \
            apps/studio/commercial/certs/AppleRootCA-G3.cer \
            apps/studio/commercial/certs/root-authority.v1.json

      - name: Verify modern Supabase secret-key runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SUPABASE_SECRET_KEY" \
            apps/studio/commercial/lib/config.js
          grep -q "supabaseSecretKey" \
            apps/studio/commercial/lib/config.js
          grep -q "supabaseSecretKey" \
            apps/studio/commercial/lib/commercial-writer-client.js
          grep -q "apikey: secretKey" \
            apps/studio/commercial/lib/commercial-writer-client.js

          if grep -R -n -E \
            'SUPABASE_SERVICE_ROLE|supabaseServiceRole' \
            apps/studio/commercial/lib \
            apps/studio/commercial/api; then
            echo 'Legacy service-role credential dependency remains in runtime source.'
            exit 1
          fi

          if grep -E -i \
            'authorization[^\n]*secretKey|Bearer[^\n]*secretKey' \
            apps/studio/commercial/lib/commercial-writer-client.js; then
            echo 'Modern secret key must never be sent as Authorization Bearer.'
            exit 1
          fi

          grep -q 'Authorization: `Bearer ${token}`' \
            apps/studio/commercial/lib/apple-device-reconcile-http.js
          grep -q 'supabasePublishableKey' \
            apps/studio/commercial/lib/apple-device-reconcile-http.js

      - name: Verify no live credential or target embedded
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E \
            'dcdggqyazdddrfuzwavw|sb_secret_[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{20,}' \
            apps/studio/commercial/lib \
            apps/studio/commercial/api \
            apps/studio/commercial/tests/foundation.test.js \
            apps/studio/commercial/tests/commercial-writer-client.test.js; then
            echo 'Unexpected live Supabase target or credential material.'
            exit 1
          fi

      - name: Record Supabase secret-key runtime authority
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="${GITHUB_SHA}"
          branch='feature/zstudio-apple-server-verification-v1'
          marker='apps/studio/commercial/verification/supabase-secret-key-runtime.v1.json'

          rm -rf apps/studio/commercial/node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          mkdir -p "$(dirname "$marker")"

          cat > "$marker" <<EOF
          {
            "authority": "ZSTUDIO_SUPABASE_SECRET_KEY_COMMERCIAL_RUNTIME_V1",
            "result": "PASS",
            "testedCommit": "$tested_sha",
            "serverCredential": "SUPABASE_SECRET_KEY",
            "secretKeyHeader": "apikey",
            "secretKeyAuthorizationBearer": false,
            "legacyServiceRoleRuntimeDependency": false,
            "userBearerAuthPreserved": true,
            "databaseRoleServiceRoleUnchanged": true,
            "liveSecretConfigured": false,
            "liveDatabaseMutation": false,
            "vercelMutation": false,
            "productionDeploymentCreated": false
          }
          EOF

          unexpected="$({ git status --porcelain --untracked-files=all; } \
            | awk '$2 != "apps/studio/commercial/verification/supabase-secret-key-runtime.v1.json" { print }')"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected mutation(s):'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git add "$marker"
          git commit -m 'test(studio): record Supabase secret-key runtime pass'

          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" \
              && git push origin "HEAD:$branch"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to serialize Supabase secret-key authority marker.'
              exit 1
            fi
            sleep 2
          done

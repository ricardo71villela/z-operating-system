name: Z Find Browser

on:
  push:
    branches: [main]
    paths:
      - "apps/find/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/find-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/find/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/find-browser.yml"

jobs:
  browser:
    name: Playwright browser suite
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-test-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify Z Find release surface authority
        run: node apps/find/tests/unit/release-surface-authority.test.js

      - name: Verify Search Map Foundation V1
        run: node apps/find/tests/unit/search-map-foundation.test.js

      - name: Verify Search Map Clustering V1
        run: node apps/find/tests/unit/search-map-clustering.test.js

      - name: Verify Search Map Viewport V1
        run: node apps/find/tests/unit/search-map-viewport.test.js

      - name: Verify Search Map Interaction V1
        run: node apps/find/tests/unit/search-map-interaction.test.js

      - name: Verify Search Map Presentation V1
        run: node apps/find/tests/unit/search-map-presentation.test.js

      - name: Verify six-language and SEO contracts
        run: |
          npm run test:public-language-foundation --workspace=z-find-platform
          npm run test:seo-pages --workspace=z-find-platform
          npm run test:seo-deployment --workspace=z-find-platform

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Z Find Web, Admin and Partner
        run: |
          npm run build:zfind --workspace=z-find-platform
          npm run build:admin --workspace=z-find-platform
          npm run build:partner --workspace=z-find-platform

      - name: Run Z Find browser tests
        run: npm run test:browser --workspace=z-find-platform

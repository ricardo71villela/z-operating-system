name: One-shot Z Studio empty-state golden approval PR

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/maintenance-zstudio-empty-golden-pr.yml'
      - 'apps/studio/goldens/estado-vazio.png'

permissions:
  contents: write
  actions: read

jobs:
  approve:
    if: github.head_ref == 'chore/zos-five-app-convergence-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout convergence head
        uses: actions/checkout@v4
        with:
          ref: chore/zos-five-app-convergence-v1
          fetch-depth: 0

      - name: Promote exact validated empty-state candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='apps/studio/goldens/estado-vazio.png'
          approved='34d4d53249de29545e4fff4711d70a16c67345ef1e606d262654469bcfce4ebf'
          current="$(sha256sum "$target" | awk '{print $1}')"
          echo "CURRENT_EMPTY_STATE_SHA256=$current"
          echo "APPROVED_EMPTY_STATE_SHA256=$approved"
          if [ "$current" = "$approved" ]; then
            echo 'EMPTY_STATE_GOLDEN_ALREADY_APPROVED=PASS'
            exit 0
          fi

          curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9484579507/zip" \
            --output /tmp/zstudio-current-visual-candidates.zip
          rm -rf /tmp/zstudio-current-visual-candidates
          mkdir -p /tmp/zstudio-current-visual-candidates
          unzip -q /tmp/zstudio-current-visual-candidates.zip -d /tmp/zstudio-current-visual-candidates
          candidate="$(find /tmp/zstudio-current-visual-candidates -type f -name 'estado-vazio.png' -print -quit)"
          test -n "$candidate"
          actual="$(sha256sum "$candidate" | awk '{print $1}')"
          echo "ARTIFACT_EMPTY_STATE_SHA256=$actual"
          test "$actual" = "$approved"
          cp "$candidate" "$target"
          test "$(sha256sum "$target" | awk '{print $1}')" = "$approved"

          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "$target"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$target"
          git commit -m 'test(studio): approve validated empty-state visual baseline'
          git push origin HEAD:chore/zos-five-app-convergence-v1
          echo 'EMPTY_STATE_GOLDEN_APPROVAL=PASS'

name: Z Jobs — sonda La Bonne Boîte

# Temporário: confirma o formato da API La Bonne Boîte v2 antes de a ligar
# às empresas do Z Jobs. Só lê a API e mostra a estrutura da resposta.

on:
  pull_request:
    paths:
      - "apps/jobs/ingest/labonneboite/**"
      - ".github/workflows/zjobs-labonneboite-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/jobs/ingest/labonneboite
    env:
      FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/probe.py | tee probe.txt
      - name: Resultado no PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<details><summary>Sonda La Bonne Boîte</summary>'; echo; echo '```'; head -c 60000 probe.txt; echo '```'; echo '</details>'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

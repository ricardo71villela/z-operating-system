name: Z Studio Apple Notification Reconciliation Authority

on:
  push:
    branches:
      - feature/zstudio-apple-server-verification-v1
    paths:
      - 'apps/studio/commercial/lib/apple-notification-reconciliation.js'
      - 'apps/studio/commercial/tests/apple-notification-reconciliation.test.js'
      - 'apps/studio/commercial/package.json'
      - '.github/workflows/zstudio-apple-notification-reconciliation-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apple-notification-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact triggering authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install exact commercial dependencies
        working-directory: apps/studio/commercial
        run: npm ci --ignore-scripts

      - name: Check commercial runtime syntax
        working-directory: apps/studio/commercial
        run: npm run check

      - name: Test full commercial runtime
        working-directory: apps/studio/commercial
        run: npm test

      - name: Verify exact 4J mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/zstudio-apple-notification-reconciliation-authority.yml' \
            'apps/studio/commercial/lib/apple-notification-reconciliation.js' \
            'apps/studio/commercial/package.json' \
            'apps/studio/commercial/tests/apple-notification-reconciliation.test.js' \
            | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected 4J mutation boundary:'
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Verify frozen authorities remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${GITHUB_SHA}^" "${GITHUB_SHA}" -- \
            infrastructure/supabase/migrations/20260819130000_zstudio_commercial_activation_authority_v1.sql \
            apps/studio/commercial/package-lock.json \
            apps/studio/commercial/store-products.v1.json \
            apps/studio/commercial/certs/AppleIncRootCertificate.cer \
            apps/studio/commercial/certs/AppleRootCA-G2.cer \
            apps/studio/commercial/certs/AppleRootCA-G3.cer \
            apps/studio/commercial/certs/root-authority.v1.json \
            apps/studio/commercial/lib/apple-signed-data.js \
            apps/studio/commercial/lib/apple-server-api.js \
            apps/studio/commercial/lib/apple-notifications.js \
            apps/studio/commercial/lib/commercial-event-adapter.js \
            apps/studio/commercial/lib/commercial-writer-client.js

      - name: Verify service remains endpoint-free and live-neutral
        shell: bash
        run: |
          set -euo pipefail
          file='apps/studio/commercial/lib/apple-notification-reconciliation.js'
          if grep -E \
            'dcdggqyazdddrfuzwavw|sb_secret_[A-Za-z0-9_-]+|eyJ[a-zA-Z0-9_-]{20,}|req\.|res\.|listen\(' \
            "$file"; then
            echo 'Live authority, credential literal, or HTTP endpoint entered 4J service.'
            exit 1
          fi
          if grep -E 'setInterval\(|setTimeout\(.*reconcileAppleNotificationToCommercialState' "$file"; then
            echo 'Automatic notification retry entered 4J service.'
            exit 1
          fi

      - name: Record Apple notification reconciliation authority
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="${GITHUB_SHA}"
          branch='feature/zstudio-apple-server-verification-v1'
          marker='apps/studio/commercial/verification/apple-notification-reconciliation.v1.json'

          rm -rf apps/studio/commercial/node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          mkdir -p "$(dirname "$marker")"

          cat > "$marker" <<EOF
          {
            "authority": "ZSTUDIO_APPLE_NOTIFICATION_RECONCILIATION_SERVICE_V1",
            "result": "PASS",
            "testedCommit": "$tested_sha",
            "notificationSourceEventRef": true,
            "notificationSignedDateEffectiveAt": true,
            "freshCurrentStateRequired": true,
            "billingRecoveryMapsTo": "recovered",
            "refundReversedMapsTo": "restored",
            "writerContractExercised": true,
            "automaticRetry": false,
            "endpointCreated": false,
            "liveWriterExecuted": false,
            "liveDatabaseMutation": false
          }
          EOF

          unexpected="$({ git status --porcelain --untracked-files=all; } \
            | awk '$2 != "apps/studio/commercial/verification/apple-notification-reconciliation.v1.json" { print }')"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected mutation(s):'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git add "$marker"
          git commit -m 'test(studio): record Apple notification reconciliation pass'

          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" \
              && git push origin "HEAD:$branch"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to serialize Apple notification reconciliation marker.'
              exit 1
            fi
            sleep 2
          done

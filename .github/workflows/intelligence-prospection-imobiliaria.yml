name: Z Intelligence — Prospection Immobiliere 74200/74500

on:
  workflow_dispatch:
    inputs:
      publicar_site:
        description: "Atualizar o site immoradar.online (dashboard + fichas PDF) e fazer commit no ramo escolhido"
        type: boolean
        default: false
      terrenos:
        description: "Terrenos livres a recalcular (demora : ~10 min as novas, varias horas todas)"
        type: choice
        options: [nenhum, novas, todas]
        default: nenhum
  schedule:
    # Semanal : toda segunda-feira às 03:00 UTC (04:00/05:00 em França,
    # consoante a hora de verão) -- horário de baixo tráfego, fora do
    # rate-limit de 10 chamadas/s/IP da API DPE ADEME.
    - cron: "0 3 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/intelligence/pipelines/prospection-immobiliere-74200-74500/src
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ../requirements.txt

      - name: Auto-testes de normalizacao e scoring
        run: |
          python normalize.py
          python scoring.py

      - name: Testes de pricing e argumentario
        run: |
          python test_pricing.py
          python test_argumentaire.py
          python test_segment_surface.py
          python test_terrenos_filtro.py
          python test_bdnb_export.py

  ingest:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/intelligence/pipelines/prospection-immobiliere-74200-74500
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar dependencias nativas do weasyprint (geracao de PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev libcairo2 shared-mime-info

      - name: Instalar weasyprint
        run: pip install weasyprint

      - name: Correr o pipeline (BAN + DVF + DPE + scoring + export + PDFs)
        id: pipeline
        shell: bash
        run: |
          set -o pipefail
          python src/main.py 2>&1 | tee pipeline_output.log

      # Terrenos livres (cadastre + PLU + BD TOPO) : so a pedido, porque faz
      # milhares de chamadas a APIs publicas. "novas" = Sciez e as 4 comunas
      # do 74550 (acrescentadas a 7/10/2026) ; o site guarda os das outras.
      - name: Terrenos livres
        if: success() && github.event_name == 'workflow_dispatch' && inputs.terrenos != 'nenhum'
        # Milhares de chamadas a APIs publicas (PLU, IGN) : se demorar demais ou
        # falhar, o site e publicado na mesma, com os terrenos ja existentes
        # (run de 8/10/2026 : mais de 2 h so para as 5 comunas novas).
        timeout-minutes: 90
        continue-on-error: true
        env:
          TERRENOS_COMMUNES: ${{ inputs.terrenos == 'novas' && '74263,74053,74106,74206,74210' || '' }}
        run: python src/enrich_terrenos_livres.py

      # Diagnostic ajoute le 2026-10-01 : le job echoue systematiquement
      # depuis 4 executions (07/09 a 28/09) sur cette etape, trop vite
      # (54s-2min) pour un vrai probleme de donnees. Cette etape garde le
      # log complet comme artefact MEME EN CAS D'ECHEC (if: always()),
      # pour pouvoir enfin lire l'erreur exacte -- jusqu'ici invisible car
      # le telechargement direct des logs GitHub Actions passe par un
      # domaine bloque depuis l'environnement d'audit utilise.
      - name: Publier le log du pipeline (toujours, meme en cas d'echec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: apps/intelligence/pipelines/prospection-immobiliere-74200-74500/pipeline_output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar resultados como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prospection-74200-74500-output
          path: apps/intelligence/pipelines/prospection-immobiliere-74200-74500/output/
          retention-days: 30

      # Publicacao no site (so em execucao manual com "publicar_site") :
      # recalcula o dashboard e gera uma ficha PDF por morada, depois faz
      # commit no ramo em que o workflow foi lancado (nunca diretamente em
      # main por defeito : lancar num ramo e abrir um pull request).
      - name: Atualizar o site Radar Leman (dashboard + dados das fichas)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publicar_site
        working-directory: .
        run: |
          python apps/intelligence/radar-leman-web/scripts/update-from-pipeline.py \
            --output apps/intelligence/pipelines/prospection-immobiliere-74200-74500/output
          cd apps/intelligence/radar-leman-web
          node scripts/split-dashboard.js
          node scripts/build-fichas-data.js

      - name: Commit da atualizacao do site
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publicar_site
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/intelligence/radar-leman-web/private
          git commit -m "Radar Léman: dados do pipeline de $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}

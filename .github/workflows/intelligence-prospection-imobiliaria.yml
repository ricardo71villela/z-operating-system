name: Z Intelligence — Prospection Immobiliere 74200/74500

on:
  workflow_dispatch: {}
  schedule:
    # Semanal : toda segunda-feira às 03:00 UTC (04:00/05:00 em França,
    # consoante a hora de verão) -- horário de baixo tráfego, fora do
    # rate-limit de 10 chamadas/s/IP da API DPE ADEME.
    - cron: "0 3 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/intelligence/pipelines/prospection-immobiliere-74200-74500/src
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ../requirements.txt

      - name: Auto-testes de normalizacao e scoring
        run: |
          python normalize.py
          python scoring.py

      - name: Testes de pricing e argumentario
        run: |
          python test_pricing.py
          python test_argumentaire.py

  ingest:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/intelligence/pipelines/prospection-immobiliere-74200-74500
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar dependencias nativas do weasyprint (geracao de PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev libcairo2 shared-mime-info

      - name: Instalar weasyprint
        run: pip install weasyprint

      - name: Correr o pipeline (BAN + DVF + DPE + scoring + export + PDFs)
        id: pipeline
        shell: bash
        run: |
          set -o pipefail
          python src/main.py 2>&1 | tee pipeline_output.log

      # Diagnostic ajoute le 2026-10-01 : le job echoue systematiquement
      # depuis 4 executions (07/09 a 28/09) sur cette etape, trop vite
      # (54s-2min) pour un vrai probleme de donnees. Cette etape garde le
      # log complet comme artefact MEME EN CAS D'ECHEC (if: always()),
      # pour pouvoir enfin lire l'erreur exacte -- jusqu'ici invisible car
      # le telechargement direct des logs GitHub Actions passe par un
      # domaine bloque depuis l'environnement d'audit utilise.
      - name: Publier le log du pipeline (toujours, meme en cas d'echec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: apps/intelligence/pipelines/prospection-immobiliere-74200-74500/pipeline_output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar resultados como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prospection-74200-74500-output
          path: apps/intelligence/pipelines/prospection-immobiliere-74200-74500/output/
          retention-days: 30

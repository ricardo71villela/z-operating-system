name: Z Studio Apple StoreKit Authority

on:
  push:
    paths:
      - 'apps/studio/native/ios/**'
      - 'apps/studio/tests/apple-storekit-native-authority.test.js'
      - '.github/workflows/zstudio-apple-storekit-authority.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/studio/native/ios/**'
      - 'apps/studio/tests/apple-storekit-native-authority.test.js'
      - '.github/workflows/zstudio-apple-storekit-authority.yml'

permissions:
  contents: read

concurrency:
  group: zstudio-apple-storekit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-storekit-native:
    name: Apple StoreKit Native Contract
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify static StoreKit authority
        run: node apps/studio/tests/apple-storekit-native-authority.test.js

      - name: Install native Capacitor dependencies
        run: npm ci --prefix apps/studio/native

      - name: Verify Xcode authority
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          XCODE_VERSION="$(
            xcodebuild -version |
            awk 'NR == 1 { print $2 }'
          )"

          XCODE_MAJOR="${XCODE_VERSION%%.*}"

          test "$XCODE_MAJOR" -ge 26

          echo "XCODE_MAJOR=$XCODE_MAJOR"
          echo "PASS: Xcode 26+ authority"

      - name: Compile native iOS StoreKit authority
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project apps/studio/native/ios/App/App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

          echo "ZSTUDIO_APPLE_STOREKIT_NATIVE_CI=PASS"

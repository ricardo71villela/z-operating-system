name: Z Studio Auth Build Artifact TEMP

on:
  push:
    branches:
      - feature/zstudio-passwordless-auth-v1
    paths:
      - '.github/workflows/zstudio-auth-build-artifact-temp.yml'

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Generate read-only Auth artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Auth branch
        uses: actions/checkout@v4
        with:
          ref: feature/zstudio-passwordless-auth-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish temporary run pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg target "$TARGET_URL" '{state:"pending",context:"Z Studio Auth Artifact TEMP",description:"read-only auth build running",target_url:$target}' >/tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
      - name: Patch Release Authority in workspace only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/zstudio-release-authority.yml')
          text = path.read_text()
          if 'Verify passwordless Auth session contract' not in text:
              needle = '''      - name: Verify current split-backend AI architecture
        run: |
          grep -Fq "const AI_ENDPOINT = 'https://z-studio-platform-seven.vercel.app/api/ai';" src/main.js
          echo "AI_SPLIT_BACKEND_CONTRACT=PASS"
'''
              replacement = needle + '''      - name: Verify passwordless Auth session contract
        run: npm run test:auth
'''
              if text.count(needle) != 1:
                  raise SystemExit('Expected exact Release Authority insertion anchor once')
              path.write_text(text.replace(needle, replacement))
          PY
      - name: Build and verify Auth contract
        working-directory: apps/studio
        run: npm run test:auth
      - name: Verify generated parity
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          cmp -s app/index.html app/my-studio.html
          cmp -s app/index.html native/www/index.html
          grep -Fq 'ZSTUDIO_PASSWORDLESS_AUTH_V1' app/index.html
          grep -Fq 'Authorization: `Bearer ${accessToken}`' app/index.html
          ! grep -Fq 'service_role' app/index.html
          echo 'AUTH_GENERATED_PARITY=PASS'
      - name: Publish generated boundary
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: zstudio-auth-build-output
          path: |
            .github/workflows/zstudio-release-authority.yml
            apps/studio/app/index.html
            apps/studio/app/my-studio.html
            apps/studio/native/www/index.html
          if-no-files-found: error
          retention-days: 1
      - name: Publish artifact pointer status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DESCRIPTION="artifact:${ARTIFACT_ID}"
          jq -n --arg target "$TARGET_URL" --arg description "$DESCRIPTION" '{state:"success",context:"Z Studio Auth Artifact TEMP",description:$description,target_url:$target}' >/tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
      - name: Publish failure pointer status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg target "$TARGET_URL" '{state:"failure",context:"Z Studio Auth Artifact TEMP",description:"read-only auth build failed",target_url:$target}' >/tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null

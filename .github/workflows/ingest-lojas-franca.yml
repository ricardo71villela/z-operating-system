name: Ingestao Lojas Franca

# Base das lojas francesas para o Z Fashion (tabela lojas no Supabase ZOS):
# roupa, calçado, marroquinaria, desporto, cosmética e perfumes.
# Todas as segundas-feiras às 06:00 UTC, ou à mão no separador Actions.
# Num pull request que mexa no pipeline, só corre os testes.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      steps:
        description: "Passos (all, sirene, enrich)"
        required: false
        default: "all"
      dept:
        description: "Só este departamento (ex. 74) — vazio = todos"
        required: false
        default: ""
      enrich_limit:
        description: "Lojas a enriquecer nesta execução"
        required: false
        default: "300"
  pull_request:
    paths:
      - "90-platform-engineering/lojas-franca-ingest/**"
      - ".github/workflows/ingest-lojas-franca.yml"

permissions:
  contents: read

concurrency:
  group: lojas-franca-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: 90-platform-engineering/lojas-franca-ingest
    env:
      ZFIND_SUPABASE_SERVICE_KEY: ${{ secrets.ZFIND_SUPABASE_SERVICE_KEY }}
      STEPS: ${{ github.event.inputs.steps || 'all' }}
      DEPT: ${{ github.event.inputs.dept || '' }}
      ENRICH_LIMIT: ${{ github.event.inputs.enrich_limit || '300' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        id: tests
        run: python tests/test_lojas.py

      - name: SIRENE — lojas ativas por setor e departamento
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && github.event_name != 'pull_request' && (env.STEPS == 'all' || contains(env.STEPS, 'sirene')) }}
        run: |
          if [ -n "$DEPT" ]; then python src/fetch_sirene.py --dept "$DEPT"; else python src/fetch_sirene.py; fi

      - name: Contactos — OpenStreetMap e sites
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && github.event_name != 'pull_request' && (env.STEPS == 'all' || contains(env.STEPS, 'enrich')) }}
        run: python src/enrich_osm.py --limit "$ENRICH_LIMIT"

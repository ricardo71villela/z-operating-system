name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  domain:
    name: Domain + ZOS compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/domain/package.json
      - name: Install domain dependencies
        working-directory: packages/domain
        run: npm install
      - name: Typecheck domain
        working-directory: packages/domain
        run: npm run typecheck
      - name: Run domain suites
        working-directory: packages/domain
        run: npm test

  api-typecheck:
    name: API typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck

  vertical-slice-postgres:
    name: Vertical slice (Postgres real, RLS, concorrência)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zjobs_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Create database
        env:
          PGPASSWORD: zjobs_dev_pw
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE zjobs;"
          psql -h localhost -U postgres -d zjobs -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d zjobs -f local-dev/00_supabase_stub.sql
      - name: Apply migrations in order
        env:
          PGPASSWORD: zjobs_dev_pw
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "--- $f ---"
            psql -h localhost -U postgres -d zjobs -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Apply development seeds
        env:
          PGPASSWORD: zjobs_dev_pw
        run: |
          for f in seeds/dev_seed_*.sql; do
            echo "--- $f ---"
            psql -h localhost -U postgres -d zjobs -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run full vertical slice
        env:
          DATABASE_URL: postgresql://zjobs_app:zjobs_app_dev_pw@localhost:5432/zjobs
        run: npx tsx apps/api/scripts/verify-vertical-slice.ts
      - name: Verify Supabase JWT cryptography
        run: npx tsx apps/api/src/supabaseAuth.test.ts

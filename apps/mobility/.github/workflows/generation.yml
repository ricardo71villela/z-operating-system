name: Generation Engine CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  generation:
    name: generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Generation Engine tests
        run: npm run test:generation
<!doctype html>
<html lang="fr-FR" data-locale="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Espace Partner — Z Fashion</title>
<link rel="stylesheet" href="./console.css">
<script src="./zfashion-config.js"></script>
<script src="./zfashion-auth.js" data-surface="partner"></script>
</head>
<body>
<header class="pc-header">
  <div class="pc-brand"><span class="pc-mark">Z</span><span>Fashion <small data-i18n="partnerSpace">Espace Partner</small></span></div>
  <div class="pc-header-tools">
    <label class="pc-store-switch" id="pcStoreSwitch" hidden><span class="sr-only" data-i18n="store">Boutique</span><select id="pcStore"></select></label>
    <label><span class="sr-only" data-i18n="language">Langue</span><select id="pcLocale"><option value="fr">FR</option><option value="en">EN</option></select></label>
  </div>
</header>

<nav class="pc-tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="overview" aria-selected="true" data-i18n="tabOverview">Vue d’ensemble</button>
  <button role="tab" data-tab="catalogue" aria-selected="false" data-i18n="tabCatalogue">Catalogue</button>
  <button role="tab" data-tab="stock" aria-selected="false" data-i18n="tabStock">Stock</button>
  <button role="tab" data-tab="corner" aria-selected="false" data-i18n="tabCorner">Corner</button>
  <button role="tab" data-tab="payouts" aria-selected="false" data-i18n="tabPayouts">Versements</button>
</nav>

<main class="pc-main">
  <div class="pc-flash" id="pcFlash" role="status" aria-live="polite" hidden></div>
  <section id="tab-overview" class="pc-tab" role="tabpanel"></section>
  <section id="tab-catalogue" class="pc-tab" role="tabpanel" hidden></section>
  <section id="tab-stock" class="pc-tab" role="tabpanel" hidden></section>
  <section id="tab-corner" class="pc-tab" role="tabpanel" hidden></section>
  <section id="tab-payouts" class="pc-tab" role="tabpanel" hidden></section>
</main>
<script src="./console.js"></script>
</body>
</html>
